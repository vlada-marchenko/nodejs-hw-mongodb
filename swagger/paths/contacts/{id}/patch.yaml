  tags:
    - Contacts
  summary: Update contact by id
  operationId: updateContact
  description: 'Update fields of an existing contact'
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        example: '65e4decdd286b30065d54af9'
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: '../../../components/schemas/contact.yaml'
  responses:
    '200':
      description: 'Contact updated successfully'
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully updated contact with id 65e4decdd286b30065d54af9.'
              data:
                $ref: '../../../components/schemas/contact.yaml'
    '404':
      $ref: '../../../components/responses/404.yaml'