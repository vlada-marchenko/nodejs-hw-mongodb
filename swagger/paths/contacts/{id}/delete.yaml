  tags:
    - Contacts
  summary: Delete contact by id
  operationId: deleteContact
  description: 'Delete an existing contact by its id'
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        example: '65e4decdd286b30065d54af9'
  responses:
    '200':
      description: 'Contact deleted successfully'
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully deleted contact with id 65e4decdd286b30065d54af9.'
              data:
                type: object
                nullable: true
                example: {}
    '404':
      $ref: '../../../components/responses/404.yaml'